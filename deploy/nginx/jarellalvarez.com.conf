# Template for /etc/nginx/sites-available/jarellalvarez.com on the droplet. No secrets in this file.
# Copy security-headers.conf to /etc/nginx/snippets/portfolio-security-headers.conf first.
# certbot (step 5) adds the HTTPS server block and the redirect to this file by itself.

server {
    listen 80;
    listen [::]:80;
    server_name jarellalvarez.com www.jarellalvarez.com;

    root /var/www/jarellalvarez.com;
    index index.html;
    include snippets/portfolio-security-headers.conf;

    # text compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # clean URLs: /about/ -> /about/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # fingerprinted assets never change: cache for a year
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/portfolio-security-headers.conf;
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/portfolio-security-headers.conf;
        try_files $uri =404;
    }
    # images and drawings can be re-exported: a day
    location ~* \.(webp|jpg|jpeg|png|svg|mp4)$ {
        add_header Cache-Control "public, max-age=86400";
        include snippets/portfolio-security-headers.conf;
        try_files $uri =404;
    }

    # never serve hidden files (.env, .git, .DS_Store)
    location ~ /\. { deny all; return 404; }

    # Step 6 (optional): the Ask Jarell AI helper, a small Node server on localhost.
    # location = /.netlify/functions/ask {
    #     limit_req zone=ask burst=5 nodelay;
    #     client_max_body_size 2k;
    #     proxy_set_header Host $host;
    #     proxy_set_header Origin $http_origin;
    #     proxy_pass http://127.0.0.1:8788;
    # }
}
